# echOS - Cargo Yapılandırması (.cargo/config.toml)
#
# Bu dosya, `cargo build`, `cargo run` gibi komutların varsayılan
# davranışlarını proje düzeyinde özelleştirir.
# Geliştiricinin her seferinde hedef ve bayrakları elle belirtmesine
# gerek kalmaz; config.toml bunları otomatik uygular.

# ============================================================
# VARSAYILAN DERLEME HEDEFİ
# ============================================================
# `target`: Belirtilmezse tüm `cargo build` komutları bu hedef için derleme yapar.
# `x86_64-unknown-uefi`: x86_64 mimarisi, UEFI firmware hedefi.
#   - "unknown" → Üretici bilinmiyor (generic)
#   - "uefi"    → UEFI firmware ABI ve EFI yüklenebilir çıktı hedefi
#
# Bu sayede `cargo build` çalıştırmak otomatik olarak EFI yüklenebilir dosyası üretir.
# ============================================================
# CARGO ALIAS'LARI
# ============================================================
# `test-host`: Host ortamında (Windows MSVC) integration testlerini koşturur.
# Kullanım: cargo test-host [-- <test-filter>]
# Örnek:    cargo test-host --test integration_suite
#           cargo test-host --test regression_suite
#           cargo test-host --test heap_stack_phys_addr_bug_test
#
# NOT: `cargo test` (alias'sız) varsayılan UEFI hedefi için
# derleme yapmaya çalışır; bu yol host test koşucusu yerine EFI hedefini derlediği için
# repo testleri için uygun değildir.
# Host-side testler için her zaman `cargo test-host` ya da
# `cargo test --target x86_64-pc-windows-msvc` kullanın.
[alias]
test-host = "test --target x86_64-pc-windows-msvc"
build-kernel = "build --target x86_64-unknown-none"
check-kernel = "check --target x86_64-unknown-none"

[build]
target = "x86_64-unknown-uefi"
jobs = 4

[profile.dev]
debug = 1

# ============================================================
# BARE-METAL HEDEFI İÇİN BAĞLAYICI AYARLARI
# ============================================================
# `[target.x86_64-unknown-none]`: Yalnızca bu hedef için geçerli ayarlar.
[target.x86_64-unknown-none]

# `linker = "rust-lld.exe"`: LLVM'in bağlayıcısı kullanılır.
# Rust ile birlikte gelen LLD (LLVM Linker), `rust-lld` adıyla erişilebilir.
# Sistem bağlayıcısı (ld/link.exe) yerine LLD tercih edilir çünkü:
#   - Cross-compilation'da hedef mimariye göre doğru bağlama yapar
#   - GNU binutils gerektirmez; özellikle Windows'ta avantajlıdır
linker = "rust-lld.exe"

# `rustflags`: Derleyici ve bağlayıcıya iletilen özel bayraklar.
# "-C" prefix'i "codegen option" (kod üretim seçeneği) anlamına gelir.
rustflags = [
    # `link-arg=-Tlinker.ld`: Özel bağlayıcı betiği kullan.
    # -T: GNU ld / LLD'e linker betiği dosyasını belirt.
    # linker.ld: Proje kökündeki bağlayıcı betiği (bellek düzenini tanımlar).
    # Bu olmadan bağlayıcı varsayılan düzeni kullanır ve çekirdek yanlış
    # adreste konumlanabilir veya boot başlığı bulunamayabilir.
    "-C", "link-arg=-Tlinker.ld",

    # `relocation-model=static`: Konum bağımsız kod (PIC) ÜRETME.
    # Çekirdek sabit bir adrese (0x100000) yüklenir;
    # dinamik yeniden konumlandırma (relocation) gereksiz ve zararlıdır.
    # Static model: Tüm adresler derleme zamanında kesinleşir.
    "-C", "relocation-model=static",

    # `link-arg=-no-pie`: PIE (Position Independent Executable) üretme.
    # PIE, dinamik bağlayıcı (ld.so) gerektiren çalıştırılabilir dosyalar içindir.
    # Bare-metal çekirdekte dinamik bağlayıcı yoktur; bu yüzden PIE devre dışı bırakılır.
    # `-no-pie` olmadan bazı bağlayıcılar PIE uyumlu kod üretmeye çalışır,
    # bu da çekirdeğin yanlış adreste çalışmasına neden olur.
    "-C", "link-arg=-no-pie",
]
