# echOS - Cargo Yapılandırması (.cargo/config.toml)
#
# Bu dosya, `cargo build`, `cargo run` gibi komutların varsayılan
# davranışlarını proje düzeyinde özelleştirir.
# Geliştiricinin her seferinde hedef ve bayrakları elle belirtmesine
# gerek kalmaz; config.toml bunları otomatik uygular.

# ============================================================
# VARSAYILAN DERLEME HEDEFİ
# ============================================================
# `target`: Belirtilmezse tüm `cargo build` komutları bu hedef için derleme yapar.
# `x86_64-unknown-uefi`: x86_64 mimarisi, UEFI firmware hedefi.
#   - "unknown" → Üretici bilinmiyor (generic)
#   - "uefi"    → UEFI firmware ABI ve EFI yüklenebilir çıktı hedefi
#
# Bu sayede `cargo build` çalıştırmak otomatik olarak EFI yüklenebilir dosyası üretir.
# ============================================================
# CARGO ALIAS'LARI
# ============================================================
# `test-host`: Host ortamında (Windows MSVC) integration testlerini koşturur.
# Kullanım: cargo test-host [-- <test-filter>]
# Örnek:    cargo test-host --test integration_suite
#           cargo test-host --test regression_suite
#           cargo test-host --test heap_stack_phys_addr_bug_test
#
# NOT: `cargo test` (alias'sız) varsayılan UEFI hedefi için
# derleme yapmaya çalışır; bu yol host test koşucusu yerine EFI hedefini derlediği için
# repo testleri için uygun değildir.
# Host-side testler için her zaman `cargo test-host` ya da
# `cargo test --target x86_64-pc-windows-msvc` kullanın.
[alias]
test-host = "test --target x86_64-pc-windows-msvc"
build-kernel = "build --target x86_64-unknown-none"
check-kernel = "check --target x86_64-unknown-none"
arch-guard = "run --target x86_64-pc-windows-msvc -p arch_guard --"

[build]
target = "x86_64-unknown-uefi"
# jobs = otomatik (CPU çekirdek sayısı kadar)

[profile.dev]
debug = 1


[target.x86_64-unknown-uefi]
rustflags = [
    "-C", "llvm-args=--x86-slh-indirect",
    "-C", "llvm-args=--x86-slh-lfence",
    "-C", "llvm-args=--x86-slh-fence-call-and-ret",
]

[target.x86_64-unknown-none]
rustflags = []

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
