# echOS - Simics Sıfır Tolerans CI/CD İş Akışı
#
# Bu GitHub Actions iş akışı, echOS çekirdeğini Intel Simics simülatöründe
# çalıştırarak "sıfır tolerans" kalite kapısı görevi görür.
#
# Simics, Intel'in donanım simülatörüdür; gerçek fiziksel donanım olmadan
# çekirdeğin UEFI ortamında doğru çalışıp çalışmadığını denetler.
#
# İş akışı tetikleme koşulları:
#   - Her pull request (main veya master dalına)
#   - Manuel tetikleme (workflow_dispatch)
#
# Not: Bu iş akışı `self-hosted` runner gerektirir çünkü Simics yalnızca
# özel lisanslı kurulum gerektiren kurumsal bir araçtır.

name: simics-zero-tolerance

# Tetikleyiciler: PR açıldığında veya güncellediğinde otomatik çalışır.
# workflow_dispatch: GitHub arayüzünden elle tetikleyebilir.
on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================
  # SIFIR TOLERANS KAPISI (ZERO-TOLERANCE GATE)
  # ============================================================
  # Bu iş, çekirdeğin Simics üzerinde hatasız çalışmasını zorunlu kılar.
  # Herhangi bir başarısızlık PR'ın birleştirilmesini (merge) engeller.
  zero_tolerance_gate:
    name: Zero-Tolerance Simics Gate
    # self-hosted: Kendi sunucumuzda çalışan runner (Simics kurulu Windows makine)
    # windows ve simics etiketleri, doğru runner'ın seçilmesini sağlar
    runs-on: [self-hosted, windows, simics]
    steps:
      # --------------------------------------------------------
      # Adım 1: Kaynak kodu indir
      # --------------------------------------------------------
      # actions/checkout@v4: Depoyu runner makinesine klonlar.
      # PR commit'ini kontrol eder, böylece test edilen kod PR kodudur.
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Adım 2: UEFI hedefi için release derlemesi yap
      # --------------------------------------------------------
      # CARGO_INCREMENTAL=0: Artımlı derlemeyi devre dışı bırakır.
      # CI ortamında artımlı derleme önbellek bozulmalarına yol açabilir,
      # bu nedenle sıfırdan temiz derleme yapılır.
      # --target x86_64-unknown-uefi: .efi uzantılı UEFI ikili dosyası üretir.
      # --release: Üretim optimizasyonlu (opt-level=s, no debug) derleme yapar.
      - name: Build UEFI target (release)
        shell: powershell
        run: |
          $env:CARGO_INCREMENTAL = "0"
          cargo build --target x86_64-unknown-uefi --release

      # --------------------------------------------------------
      # Adım 3: Önyüklenebilir VHDX disk görüntüsü oluştur
      # --------------------------------------------------------
      # VHDX: Microsoft'un sanal sabit disk formatı; Simics bu formatı destekler.
      # Build-EfiVhdx.ps1: .efi dosyasını EFI önyükleme bölümüne sahip VHDX'e paketler.
      # -SkipCraff: CRAFF (Simics'e özgü format) dönüşümü atlanır; doğrudan VHDX kullanılır.
      # (admin): Disk görüntüsü oluşturma yönetici yetkisi gerektirir (mount/format işlemleri)
      - name: Create bootable VHDX (admin)
        shell: powershell
        run: |
          $efi = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-unknown-uefi\release\ech_os.efi"
          $vhdx = Join-Path $env:GITHUB_WORKSPACE "Simics\echos-simics\targets\echos\images\echos-uefi-fixed.vhdx"
          powershell -ExecutionPolicy Bypass -File `
            "Simics\echos-simics\targets\echos\Build-EfiVhdx.ps1" `
            -EfiPath $efi -VhdxPath $vhdx -SkipCraff

      # --------------------------------------------------------
      # Adım 4: Simics Sıfır Tolerans Kapısını Çalıştır
      # --------------------------------------------------------
      # run-gate.bat: Simics'i başlatarak çekirdeği çalıştırır ve
      # önceden tanımlanmış doğrulama kriterlerini (assertions) kontrol eder.
      # Çıkış kodu 0 dışında bir değer dönerse bu adım başarısız sayılır
      # ve PR birleştirilmesi engellenir (sıfır tolerans politikası).
      - name: Run Simics Zero-Tolerance Gate
        shell: cmd
        run: Simics\echos-simics\bin\run-gate.bat

      # --------------------------------------------------------
      # Adım 5: Artefaktları yükle (her durumda çalışır)
      # --------------------------------------------------------
      # `if: always()`: Önceki adımlar başarısız olsa bile çalışır.
      # Bu sayede hata günlükleri her zaman GitHub'a yüklenir; hata ayıklama kolaylaşır.
      # Yüklenen dosyalar:
      #   - gate_*.log  : Kapı test sonuçları (JSON ve düz metin)
      #   - gate_*.json : Yapılandırılmış test çıktısı (CI sistemleri için)
      #   - serial_capture.txt: Simics'in yakaladığı seri port çıktısı (çekirdek println! çıktıları)
      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simics-zero-tolerance-logs
          path: |
            Simics/echos-simics/targets/echos/logs/gate_*.log
            Simics/echos-simics/targets/echos/logs/gate_*.json
            Simics/echos-simics/targets/echos/logs/serial_capture.txt
