[package]
name = "echOS"
version = "0.1.0"
edition = "2024"
build = "src/build.rs"

[[bin]]
name = "echos_efi" # Oluşacak EFI dosyasının adı
path = "src/main.rs"

[dependencies]
log = "0.4.27"
uefi = { version = "0.35.0", features = ["logger","panic_handler"] }
volatile = "0.6.1"
lazy_static = "1.5.0"
spin = "0.10.0"

[profile.dev]
panic = "abort"
debug = true

[profile.release]
panic = "abort"
debug = false
opt-level = "s"

[build-dependencies]
cc = "1.2.30"

