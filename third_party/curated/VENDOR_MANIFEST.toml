source_commit = "a61f9fe68fafdabf2913b9498ce9ae1a086ed11d"
source_tag = "0.8.13"
license = "0BSD"
license_file = "third_party/curated/toybox/LICENSE"
imported_files = [
  "LICENSE",
  "README",
  "main.c",
  "toys.h",
  "lib/*.c",
  "lib/*.h",
  "toys/posix/cat.c",
  "toys/posix/cp.c",
  "toys/posix/echo.c",
  "toys/posix/grep.c",
  "toys/posix/head.c",
  "toys/posix/ls.c",
  "toys/posix/mkdir.c",
  "toys/posix/rm.c",
  "toys/posix/tail.c",
  "toys/posix/wc.c",
  "tests/cat.test",
  "tests/cp.test",
  "tests/echo.test",
  "tests/grep.test",
  "tests/head.test",
  "tests/ls.test",
  "tests/mkdir.test",
  "tests/mv.test",
  "tests/rm.test",
  "tests/tail.test",
  "tests/wc.test",
  "tests/README.txt",
]
mutation_scope = "none; imported subset excludes upstream kconfig GPLv2 build configurator and non-selected command trees"
verification = "license file imported; official license page and upstream LICENSE identify 0BSD; local GPL/LGPL/AGPL scan over imported toybox subset returned no hits"

