source_repository = "https://github.com/phoboslab/qoi"
source_commit = "6fff9b70dd79b12f808b0acc5cb44fde9998725e"
license = "MIT"
license_file = "third_party/curated/qoi/LICENSE"
imported_files = ["LICENSE", "README.md", "qoi.h", "qoiconv.c"]
mutation_scope = "none"
verification = "license file imported; upstream README states single-file MIT library"

[[components]]
