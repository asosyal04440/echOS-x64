license_file = "third_party/curated/tomlc17/LICENSE"
imported_files = ["LICENSE", "README.md", "tomlc17.c", "tomlc17.h"]
mutation_scope = "none"
verification = "license file imported; upstream README states direct include of tomlc17.c/h and C99 compatibility"

[[components]]
name = "dr_libs"
role = "Single-file WAV, FLAC, and MP3 codec sources for future audio decode tooling"
source_repository = "https://github.com/mackron/dr_libs"
source_commit = "3a7644aacd8fb1f1dafb6201c581234a80ede120"
