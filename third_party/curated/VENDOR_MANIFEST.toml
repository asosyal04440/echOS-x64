[vendor_set]
name = "echOS curated app/tool seed sources"
imported_at = "2026-04-19"
policy = "Permissive-license, low-dependency sources only. Keep upstream files unmodified; put echOS adapters outside imported files."

[[components]]
name = "kilo"
role = "Text editor seed for ech-edit"
source_repository = "https://github.com/antirez/kilo"
source_commit = "323d93b29bd89a2cb446de90c4ed4fea1764176e"
license = "BSD-2-Clause"
license_file = "third_party/curated/kilo/LICENSE"
imported_files = ["LICENSE", "README.md", "kilo.c"]
mutation_scope = "none"
verification = "license file imported; upstream README states no curses dependency and BSD-2-Clause license"

[[components]]
name = "jsmn"
role = "JSON tokenizer/parser for manifests and small tools"
source_repository = "https://github.com/zserge/jsmn"
source_commit = "25647e692c7906b96ffd2b05ca54c097948e879c"
license = "MIT"
license_file = "third_party/curated/jsmn/LICENSE"
imported_files = ["LICENSE", "README.md", "jsmn.h"]
mutation_scope = "none"
verification = "license file imported; upstream README states C89, no dependencies, no dynamic allocation"

[[components]]
name = "miniz"
role = "Compression core for zlib/deflate/ZIP tooling"
source_repository = "https://github.com/richgel999/miniz"
source_commit = "4b9fcf1df525114484be49f3216169b061c07ac6"
license = "MIT"
license_file = "third_party/curated/miniz/LICENSE"
imported_files = ["LICENSE", "readme.md", "miniz.c", "miniz.h"]
mutation_scope = "none"
verification = "license file imported; selected source/header pair from pinned upstream commit"

[[components]]
name = "stb"
role = "Image decode/write/resize source for ech-view tooling"
source_repository = "https://github.com/nothings/stb"
source_commit = "31c1ad37456438565541f4919958214b6e762fb4"
license = "Public-Domain OR MIT"
license_file = "third_party/curated/stb/LICENSE"
imported_files = ["LICENSE", "README.md", "stb_image.h", "stb_image_write.h", "stb_image_resize2.h", "stb_truetype.h", "stb_sprintf.h", "stb_textedit.h", "stb_vorbis.c"]
mutation_scope = "none"
verification = "license file imported; upstream README documents single-file integration model and public-domain/MIT dual license"

[[components]]
