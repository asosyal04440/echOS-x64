license = "MIT"
license_file = "third_party/curated/ini/LICENSE"
imported_files = ["LICENSE", "README.md", "ini.c", "ini.h"]
mutation_scope = "none"
verification = "license file imported; upstream README states ANSI C drop-in ini.c/ini.h model"

[[components]]
name = "linenoise"
role = "Line editing, history, completion, and hints source for future shell/REPL tooling"
source_repository = "https://github.com/antirez/linenoise"
source_commit = "452e3793858a15cc006bb3aa3ea06378eb98c5b5"
license = "BSD-2-Clause"
license_file = "third_party/curated/linenoise/LICENSE"
imported_files = ["LICENSE", "README.markdown", "linenoise.c", "linenoise.h"]
mutation_scope = "none"
verification = "license file imported; upstream README states BSD-licensed readline replacement; echOS tty, fd, history, and allocator adapters not wired in this import"

[[components]]
name = "sqlite"
role = "Embedded SQL database core and CLI seed for package metadata, settings, and structured state"
source_repository = "https://www.sqlite.org/download.html"
source_archive = "https://www.sqlite.org/2026/sqlite-amalgamation-3530000.zip"
source_release = "3.53.0"
source_sha3_256 = "c2325c53b3b41761469f91cfb078e96882ac5d85bac10c11b0bd8f253b031e5b"
license = "Public-Domain"
license_file = "third_party/curated/sqlite/LICENSE.html"
imported_files = ["LICENSE.html", "shell.c", "sqlite3.c", "sqlite3.h", "sqlite3ext.h"]
mutation_scope = "none"
verification = "official SQLite download metadata pinned release 3.53.0 amalgamation with matching SHA3-256; sqlite3.h carries SQLite's public-domain blessing; echOS VFS/allocator shims remain outside imported files"

[[components]]
name = "lua"
role = "Embeddable scripting language source tree for shell scripting and extension runtime work"
source_repository = "https://www.lua.org/ftp/"
source_archive = "https://www.lua.org/ftp/lua-5.4.8.tar.gz"
source_release = "5.4.8"
license = "MIT"
license_file = "third_party/curated/lua/doc/readme.html"
imported_files = ["Makefile", "README", "doc/*", "src/*"]
mutation_scope = "none"
verification = "official Lua FTP release 5.4.8 imported with upstream README/doc tree; upstream doc/readme.html carries the MIT license text; echOS-specific stdlib pruning and allocator hooks remain outside imported files"

[[components]]
name = "toybox"
role = "Selected 0BSD terminal utility source subset for ech-tools"
