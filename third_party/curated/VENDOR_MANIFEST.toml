imported_files = ["LICENSE", "README.md", "dr_wav.h", "dr_flac.h", "dr_mp3.h"]
mutation_scope = "none"
verification = "license file imported; upstream README describes public-domain single-file audio decoding libraries; no echOS audio path wiring in this import"

[[components]]
