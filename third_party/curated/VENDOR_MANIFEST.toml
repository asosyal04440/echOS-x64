role = "Minimal tar archive read/write source for package tooling"
source_repository = "https://github.com/rxi/microtar"
source_commit = "27076e1b9290e9c7842bb7890a54fcf172406c84"
license = "MIT"
license_file = "third_party/curated/microtar/LICENSE"
imported_files = ["LICENSE", "README.md", "microtar.c", "microtar.h"]
mutation_scope = "none"
verification = "license file imported; upstream README identifies ANSI C tar library; adapters and corpus tests remain outside upstream files"

[[components]]
